interface:
  display_name: "小红书笔记发布"
  short_description: "研究近30天同类内容后生成并预审小红书笔记"
  default_prompt: "使用 $xiaohongshu-publish 处理小红书笔记：趋势研究时先打开小红书站内搜索页、公开笔记页或我提供的站内链接，再按可见点赞筛选近30天同类公开样本 Top20；分析可实际读取的标题、正文、封面、轮播图和公开视频关键帧，不局限于文字。站内访问失败时先向我说明并等待我明确授权公开网页调研，不要直接改用互联网搜索。随后提炼当前时点内容概要，生成文案、做事实与风险预审，最后校验发布字段并与我确认。"
