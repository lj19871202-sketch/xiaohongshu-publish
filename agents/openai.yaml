interface:
  display_name: "小红书笔记发布"
  short_description: "研究近30天同类内容后生成并预审小红书笔记"
  default_prompt: "使用 $xiaohongshu-publish 处理小红书笔记。凡涉及趋势研究、同类内容、爆文、Top20、当前热门，或只提供主题并要求产出，第一动作必须通过浏览器实际打开小红书站内搜索页、公开笔记页或我提供的站内链接，并先报告 site_search_status: started；在站内访问结果记录前，不得生成文案、调用通用互联网搜索或用搜索引擎结果替代站内样本。站内成功后，按可见点赞筛选近30天同类公开样本 Top20，并分析可实际读取的标题、正文、封面、轮播图和公开视频关键帧，不局限于文字。站内访问失败时停止并向我说明，等待我明确授权公开网页调研。随后提炼当前时点内容概要，生成文案、做事实与风险预审，最后校验发布字段并与我确认。"
