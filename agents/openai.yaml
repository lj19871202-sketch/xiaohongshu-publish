interface:
  display_name: "小红书笔记发布"
  short_description: "研究近30天同类内容后生成并预审小红书笔记"
  default_prompt: "使用 $xiaohongshu-publish 处理小红书笔记。凡涉及趋势研究、同类内容、爆文、Top20、当前热门，或只提供主题并要求产出，第一可观察动作必须使用内置浏览器实际打开小红书站内搜索页、公开笔记页或我提供的站内链接；先报告 browser_route: in_app 和 site_search_status: started，并记录访问结果。在此之前不得打开外置 Edge/Chrome，不得启动 Playwright/Edge 桥接，不得调用通用互联网搜索，不得生成文案或趋势结论。只有内置浏览器发生明确技术失败（工具不可用、导航调用报错、页面无法加载等）后，才按内置浏览器→外置浏览器→桥接顺序逐级尝试；已有登录态、登录等待、扫码、验证码、人工确认或桥接已启动都不是跳过前一级的理由。站内成功后，按可见点赞筛选近30天同类公开样本 Top20，并分析可实际读取的标题、正文、封面、轮播图和公开视频关键帧，不局限于文字。站内访问失败时停止并向我说明，等待我明确授权公开网页调研；公开网页结果不得称为小红书站内 Top20。随后提炼当前时点内容概要，生成文案、做事实与风险预审，最后校验发布字段并与我确认。"
